name: Hardware test report / Donanım test raporu
description: Tried it on your card? Share the result; we measured only one GTX 1050 Ti. / Kendi kartınızda denediniz mi? Sonucu yazın; biz yalnız bir GTX 1050 Ti ölçtük.
title: "[hardware] <GPU> · <VRAM> · <RAM>"
labels: ["hardware-test"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Every report helps, whether it worked or not. Leave any field you do not know empty.
        The numbers are in `run.json` next to the image (`outputs/<time>_<name>/run.json`).
        Not on Windows with NVIDIA, or you ran `sd-cli` directly? Welcome too: fill in OS, GPU API and engine, and paste the timing lines of the log instead of `run.json`. Paths by card: docs/OTHER_GPUS.md.

        Teşekkürler! Çalışsa da çalışmasa da her rapor işe yarar. Bilmediğiniz alanı boş bırakın.
        Sayılar resmin yanındaki `run.json` dosyasındadır (`outputs/<zaman>_<ad>/run.json`).
        Windows ve NVIDIA dışında mısınız ya da `sd-cli`'yi doğrudan mı çalıştırdınız? Onu da bekliyoruz: işletim sistemi, GPU API ve motoru doldurun, `run.json` yerine günlükteki süre satırlarını yapıştırın. Karta göre yollar: docs/OTHER_GPUS.md.
  - type: input
    id: gpu
    attributes:
      label: GPU, memory, driver / Ekran kartı, bellek, sürücü
      description: "NVIDIA: `nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader`. AMD (Linux): `rocminfo` or / ya da `sd-cli --list-devices`. Others: name, memory, driver / Diğerleri: ad, bellek, sürücü."
      placeholder: "NVIDIA GeForce GTX 1050 Ti, 4096 MiB, 581.29"
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: RAM and OS version / RAM ve işletim sistemi sürümü
      placeholder: "16 GB, Windows 10 22H2 (10.0.19045) / 32 GB, Ubuntu 24.04.5"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / İşletim sistemi
      options:
        - Windows
        - Linux
        - macOS
        - Other / Diğer
    validations:
      required: true
  - type: dropdown
    id: gpu_api
    attributes:
      label: GPU API / GPU API'si
      options:
        - CUDA (NVIDIA)
        - ROCm / HIP (AMD)
        - Vulkan
        - Metal (Apple)
        - SYCL (Intel)
        - CPU only / Yalnız CPU
        - Other / Diğer
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Sürüm
      description: Release tag or `git log -1 --format=%h` / Release etiketi ya da `git log -1 --format=%h`
      placeholder: "v0.2.0"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine / Motor
      options:
        - Prebuilt zip from Releases (sm_61) / Releases'taki hazır zip (sm_61)
        - Built from patches/ for my card / patches/ ile kendi kartım için derledim
        - Upstream stable-diffusion.cpp without our patches (commit in Notes) / Yamasız upstream stable-diffusion.cpp (commit Notlar'da)
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command / Komut
      placeholder: "python scripts/generate.py --prompt-file prompts/eiffel.txt"
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result (run.json, or log timing lines) / Sonuç (run.json ya da günlükteki süre satırları)
      description: "`result`, `seconds`, `vae_mode`, `stages`, `gpu_memory_used_peak_mib`, `ram_free_min_mib`, `image_pixel_sha256`. Remove the `command` field if it shows a personal path. / Kişisel yol görünüyorsa `command` alanını silin. Direct `sd-cli` run: paste the timing lines of the log, size and seed. / Doğrudan `sd-cli`: günlükteki süre satırları, boyut ve tohum."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / Notlar
      description: Anything that differed from docs/MEASUREMENTS.md, error lines, what you changed. / docs/MEASUREMENTS.md'den farklı olan her şey, hata satırları, değiştirdikleriniz.
  - type: checkboxes
    id: credit
    attributes:
      label: Credit / Teşekkür
      options:
        - label: You may list this result with my GitHub name. / Bu sonucu GitHub adımla listeleyebilirsiniz.
