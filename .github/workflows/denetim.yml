# Repo quick check (kit KL-09). Rules of this file:
#  - trigger is pull_request only (never the "_target" variant of it: that one runs untrusted code with secrets)
#  - permissions: contents: read only; no secrets, no GPU, no model downloads
#  - every third-party action is pinned to a full commit SHA (a tag can be moved); update the SHAs with Dependabot
#  - REPORT MODE for the first two weeks (continue-on-error): the check reports but does not block; remove that line after
# Pinned SHAs were read with:  gh api repos/actions/checkout/git/ref/tags/<tag>  (and for setup-python)
name: denetim

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hizli-kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Quick checks (report mode)
        continue-on-error: true
        run: python -I -X utf8 scripts/denetim.py --hizli
